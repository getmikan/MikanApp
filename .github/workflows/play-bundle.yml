name: Play bundle

# A signed Android App Bundle of the "play" flavor for Google Play (package
# com.getmikan.android, no self-update). Run by hand; the .aab is an artifact.
on:
  workflow_dispatch:
  push:
    branches: [play-bundle]

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    environment: production-release

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      # Same toolchain as upstream CMFA: a MetaCubeX build of Go with the two GOROOT patches from
      # .github/patch applied (pidfd disabled on Android — golang/go#69065 SIGSYS under seccomp;
      # futex_time64 removed on 32-bit Linux). Without this the runner's stock Go compiled the core
      # unpatched. GOTOOLCHAIN=local (job env) stops `go` from silently downloading another version.
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build'
          go-version: '1.26'
          cache: false

      - name: Apply Go runtime patches
        run: |
          cd "$(go env GOROOT)"
          for p in "$GITHUB_WORKSPACE"/.github/patch/*.patch; do
            patch --verbose -p1 < "$p"
          done
          go version

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Restore Android signing files
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Signing secrets are missing. Configure ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
          cat > signing.properties <<EOF
          keystore.password=$ANDROID_KEYSTORE_PASSWORD
          key.alias=$ANDROID_KEY_ALIAS
          key.password=$ANDROID_KEY_PASSWORD
          EOF

      - name: Guard - HandlerService must not exist
        run: |
          if grep -R --line-number --fixed-strings "HandlerService" app/src/main service/src/main core/src/main; then
            echo "HandlerService reference detected. This path is forbidden."
            exit 1
          fi
          echo "HandlerService guard passed."

      - name: Populate embedded Root CA bundle
        run: bash .github/scripts/populate-ca-bundle.sh

      - name: Build Play Release bundle
        run: ./gradlew bundlePlayRelease

      - name: Remove Android signing files
        if: always()
        run: rm -f signing.properties release.keystore

      - name: Upload bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mikan-play-aab
          path: app/build/outputs/bundle/playRelease/*.aab
          if-no-files-found: error
